# Builds and publishes a release when a version tag (v2.0.1, …) is pushed.
# The in-app updater installs the signed zip, so the repository needs the secret
# ZENPAD_UPDATE_PRIVATE_KEY (the base64 key from ~/.config/zenpad/update_signing_key).
# Releases can also be published from a Mac with scripts/release.sh --publish.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install tools
        run: brew install xcodegen create-dmg
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(awk -F'"' '/MARKETING_VERSION/ {print $2; exit}' project.yml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Build, sign and publish
        env:
          ZENPAD_UPDATE_PRIVATE_KEY: ${{ secrets.ZENPAD_UPDATE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh --publish
