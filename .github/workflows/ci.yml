name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and test
        run: |
          xcodegen generate
          xcodebuild -project ZenPad.xcodeproj -scheme ZenPad -derivedDataPath build/ci test
