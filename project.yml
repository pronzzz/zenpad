name: ZenPad
options:
  bundleIdPrefix: com.zenpad
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: 0.7.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ZenPad:
    type: application
    platform: macOS
    sources:
      - path: ZenPad
    dependencies:
      - package: Markdown
    settings:
      base:
        PRODUCT_NAME: ZenPad
        PRODUCT_BUNDLE_IDENTIFIER: com.zenpad.app
        INFOPLIST_FILE: ZenPad/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ZenPad/Resources/ZenPad.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  ZenPadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ZenPadTests
    dependencies:
      - target: ZenPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenpad.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ZenPad.app/Contents/MacOS/ZenPad"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ZenPad:
    build:
      targets:
        ZenPad: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZenPadTests
    profile:
      config: Release
    archive:
      config: Release
